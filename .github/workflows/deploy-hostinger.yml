name: Deploy to Hostinger

# Builds the site and uploads it to Hostinger over FTP on every push to main.
# Only changed files are uploaded (the action keeps a sync-state file on the server).
#
# Setup (GitHub repo > Settings > Secrets and variables > Actions):
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD   (from Hostinger hPanel > Files > FTP Accounts)
#   Variables: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_MAILERLITE_FORM_ID (already used by GitHub Pages)
#              SITE_URL        e.g. https://www.agroaerialprecision.com/  (must end with "/")
#              FTP_SERVER_DIR  folder to upload into, e.g. public_html/   (optional, defaults to public_html/)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check FTP settings
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "FTP secrets are not set yet - skipping the Hostinger deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.ftp.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.ftp.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.ftp.outputs.configured == 'true'
        run: npm ci

      - name: Build
        if: steps.ftp.outputs.configured == 'true'
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_MAILERLITE_FORM_ID: ${{ vars.VITE_MAILERLITE_FORM_ID }}
          # Hostinger serves the site from the domain root
          VITE_BASE_PATH: /
          VITE_SITE_URL: ${{ vars.SITE_URL }}

      - name: Upload to Hostinger
        if: steps.ftp.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
